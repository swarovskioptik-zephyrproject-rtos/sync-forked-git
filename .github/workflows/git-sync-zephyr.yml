name: Sync Zephyr Project Forks

on:
  schedule: # At minute 0 past every 4th hour.
    - cron: '0 */4 * * *'
  workflow_dispatch: # And manually on button click.

jobs:
  git-sync:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo:
          - zephyr
        branch:
          - main
          - v4.2-branch
          - "refs/tags/*"

    steps:
      - name: git-sync-zephyr
        uses: swarovskioptik-zephyrproject-rtos/git-sync@v3
        with:
          source_repo: "git@github.com:zephyrproject-rtos/${{ matrix.repo }}.git"
          source_branch: "${{ matrix.branch }}"
          destination_repo: "git@github.com:swarovskioptik-zephyrproject-rtos/${{ matrix.repo }}.git"
          destination_branch: "${{ matrix.branch }}"
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY_DEVOPS_SOA_CI }}
        if: ${{ matrix.repo == 'zephyr' }}

  git-rebase:
    runs-on: ubuntu-latest

    needs: git-sync

    strategy:
      matrix:
        repo:
          - zephyr
        branch:
          - main
          - v4.2-branch

    steps:
      - name: git-rebase-zephyr
        uses: swarovskioptik-zephyrproject-rtos/git-rebase@v1
        with:
          repo: "git@github.com:swarovskioptik-zephyrproject-rtos/${{ matrix.repo }}.git"
          source_branch: "soa/${{ matrix.branch }}"
          destination_branch: "${{ matrix.branch }}"
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY_DEVOPS_SOA_CI }}
        if: ${{ matrix.repo == 'zephyr' }}
