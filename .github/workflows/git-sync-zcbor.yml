name: Sync ZCBOR

on:
  schedule: # At minute 10 past every 4th hour.
    - cron: '10 */4 * * *'
  workflow_dispatch: # And manually on button click.

jobs:
  git-sync:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo:
          - zcbor
        branch:
          - main
          - release/0.6.1
          - release/0.8.2
          - "refs/tags/*"

    steps:
      - name: git-sync-zcbor
        uses: swarovskioptik-zephyrproject-rtos/git-sync@v3
        with:
          source_repo: "git@github.com:zephyrproject-rtos/${{ matrix.repo }}.git"
          source_branch: "${{ matrix.branch }}"
          destination_repo: "git@github.com:swarovskioptik-zephyrproject-rtos/${{ matrix.repo }}.git"
          destination_branch: "${{ matrix.branch }}"
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY_DEVOPS_SOA_CI }}
        if: ${{ matrix.repo == 'zcbor' }}